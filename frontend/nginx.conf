server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # same contract the Vite dev proxy provides: strip /api, forward to the backend service
    proxy_pass http://backend:8000/;
    proxy_read_timeout 300s;      # local models can take a while to answer
  }
  location / { try_files $uri /index.html; }
}
