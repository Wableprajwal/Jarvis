services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5433:5432"   # 5433 on the host so it never collides with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis
      OLLAMA_HOST: http://host.docker.internal:11434   # Ollama runs on the host (GPU/Metal access)
      MODEL_PROVIDER: ollama
      DOCS_DIR: /srv/docs
      WORKSPACE_ROOT: /workspace
    volumes:
      - ./docs:/srv/docs:ro
      # The tree the Code agent may read and the sandbox may stage files from. The sample
      # workspace ships small, real Python files (utils/retry.py, config_loader.py, ...) so the
      # demo prompts work; point this at a repository of your own to ask about real code.
      - ./backend/app/eval/fixtures/workspace:/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
