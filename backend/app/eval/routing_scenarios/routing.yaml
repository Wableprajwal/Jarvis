# --- chains (ordered) ---
- id: route-chain-research-then-code
  input: "Look up our retry policy in the technical notes, then write unit tests for the retry function based on that policy."
  expected_agent: [research, code]
  category: routing
- id: route-chain-code-then-ops
  input: "Summarize my git diff into a pull request description, then email that summary to Dana."
  expected_agent: [code, ops]
  category: routing

