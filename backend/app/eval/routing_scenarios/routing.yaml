# Layer 1 (deterministic, no judge): did the orchestrator pick the right agent(s)?
# expected_agent: name | [ordered chain] | none

# --- code agent ---
- id: route-code-explain-file
  input: "What does the function in utils/retry.py do? Read the source file and explain it."
  expected_agent: code
  category: routing
- id: route-code-unit-tests
  input: "Generate unit tests for the parse_config function in config_loader.py."
  expected_agent: code
  category: routing
- id: route-code-pr-description
  input: "Summarize my git diff into a pull request description."
  expected_agent: code
  category: routing
- id: route-code-codebase-question
  input: "Where in the codebase is the database connection pool created? Look through the source files."
  expected_agent: code
  category: routing
- id: route-code-test-coverage
  input: "Write pytest unit tests for the function in scheduler.py that computes the next run time."
  expected_agent: code
  category: routing
- id: route-code-diff-review
  input: "Look at the git diff on this branch and write the pull request summary."
  expected_agent: code
  category: routing

