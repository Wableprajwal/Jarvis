- id: route-research-adr
  input: "Search our technical docs for the decision about retry and backoff policy and cite the source."
  expected_agent: research
  category: routing
- id: route-research-index-notes
  input: "What do our notes say about Postgres indexing guidelines? Give me a cited answer."
  expected_agent: research
  category: routing
- id: route-research-deploy-checklist
  input: "Find the deploy checklist in our documentation and tell me the steps with citations."
  expected_agent: research
  category: routing
- id: route-research-style-guide
  input: "What does our engineering style guide say about naming? Look it up in the notes."
  expected_agent: research
  category: routing

