[project]
name = "jarvis"
version = "0.1.0"
description = "Multi-agent developer tooling platform with a swappable local model backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "asyncpg==0.31.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.14.2"]
rag = [
  "numpy==2.5.3; python_version >= '3.12'",
  "numpy==2.4.6; python_version < '3.12'",
  "rank-bm25==0.2.2",
  "sentence-transformers==6.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires a running local model (auto-skipped when unavailable)"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused: unused/undefined names, likely bugs, comprehension and modernization nits.
# BLE001 is ON deliberately: this system catches broad Exception in a handful of places on purpose
# (the tool boundary, the redactor, optional-subsystem startup), and each one carries an explicit
# `# noqa: BLE001 - <reason>`. Keeping the rule enabled means a NEW broad except has to be argued
# for rather than slipping in. E501 stays off: some trace-payload literals read better unwrapped.
select = ["F", "E4", "E7", "E9", "B", "I", "UP", "C4", "SIM", "RUF", "BLE"]
ignore = ["RUF012", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
# Test modules redefine fixtures by design, and patch private attributes to inject regressions.
"tests/*" = ["F811", "SLF001", "E731"]
