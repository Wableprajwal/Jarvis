[project]
name = "jarvis"
version = "0.1.0"
description = "Multi-agent developer tooling platform with a swappable local model backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "asyncpg==0.31.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
rag = ["sentence-transformers", "rank-bm25", "pgvector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
